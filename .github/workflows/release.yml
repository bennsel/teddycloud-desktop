name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Release-Beschreibung aus CHANGELOG.md; scheitert früh bei fehlendem Abschnitt oder falscher Version
  notes:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python packaging/release_notes.py "$GITHUB_REF_NAME" -o notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md

  build:
    strategy:
      fail-fast: false
      matrix:
        # Ältestes Ubuntu für eine möglichst niedrige glibc-Anforderung, macOS auf Apple Silicon
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Qt-Systembibliotheken (Linux)
        if: runner.os == 'Linux'
        # Damit PyInstaller die Abhängigkeiten von QtMultimedia vollständig auflösen kann
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0
      - name: Anwendung bauen
        run: uv run --frozen --with pyinstaller python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    needs: [notes, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: dist
      # Getrennt von dist/, damit notes.md nicht als Datei am Release landet
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          # Hängt PR-Liste und „Full Changelog“-Link an die Beschreibung an
          generate_release_notes: true
