[project]
name = "teddycloud-desktop"
version = "0.1.0"
description = "Cross-platform desktop app (PyQt6) for managing the tonies and Tonieboxes of a TeddyCloud server"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Bennsel" }
]
keywords = ["teddycloud", "toniebox", "tonies", "pyqt6", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: German",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio",
]
requires-python = ">=3.11"
dependencies = [
    "keyring>=25",
    "mutagen>=1.48.1",
    "pyqt6>=6.11.0",
]

[project.urls]
Homepage = "https://github.com/bennsel/teddycloud-desktop"
Issues = "https://github.com/bennsel/teddycloud-desktop/issues"

[project.scripts]
teddycloud-desktop = "teddycloud_desktop:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Zeilenlänge regelt ruff format; lange Strings bleiben erlaubt
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
